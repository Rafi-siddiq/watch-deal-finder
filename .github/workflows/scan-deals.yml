# Runs the deal scan here (Vercel's free plan only allows a daily cron, and its 60s limit
# only fits part of a sweep). GitHub runs frequent schedules hours late, so each run loops
# for ~5.5h scanning every 15 minutes, then starts its own replacement; the schedule below
# is only a watchdog that restarts the loop if it ever stops. Each cycle reads the newest
# r/WE + r/watch_swap posts; every 3h it sweeps the whole 14-day window; eBay at most hourly;
# then it asks the site to AI-review whatever is new. Needs repo secrets
# UPSTASH_REDIS_REST_URL / _TOKEN (eBay, Reddit, CRON_SECRET and APP_URL optional).
# Run workflow with "full" ticked to force a full sweep now.
name: scan-deals

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Sweep the whole 14-day window now"
        type: boolean
        default: false

# One loop at a time; a watchdog run that fires mid-loop waits, and only the newest waiting run is kept.
concurrency:
  group: scan-deals
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "UPSTASH_REDIS_REST_URL / _TOKEN not set; skipping."
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.gate.outputs.ok
      - name: Scan every 15 minutes for ~5.5h
        if: steps.gate.outputs.ok
        env:
          LOOP_MINUTES: "320"
          CYCLE_MINUTES: "15"
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          MIN_NET_PROFIT: ${{ secrets.MIN_NET_PROFIT }}
          MAX_PURCHASE_PRICE: ${{ secrets.MAX_PURCHASE_PRICE }}
          # Optional Reddit app keys: removes sold/deleted posts each run (anonymous Reddit blocks GitHub too).
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCAN_MODE: ${{ inputs.full && 'full' || '' }}
        run: npx -y tsx@4.19.2 scripts/scan-actions.ts
      - name: Start the next loop
        if: success() && steps.gate.outputs.ok
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/scan-deals.yml/dispatches" -f ref=main
