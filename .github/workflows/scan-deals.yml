# Optional: runs the deal scan every 15 minutes (Vercel's free plan only allows a daily cron).
# Turn it on by adding repo secrets APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET
# (same value as on Vercel). Without them it skips quietly; the dashboard's "Check now" works regardless.
name: scan-deals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger scan
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -sS --fail-with-body -m 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/scan-deals"
